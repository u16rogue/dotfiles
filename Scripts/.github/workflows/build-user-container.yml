name: (pc-w0) User Container

on:
  push:
    branches:
      - pc-w0
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-container image
        run: |
          docker build -t ghcr.io/u16rogue/user-container:latest -f Scripts/user-container.containerfile .
          docker push ghcr.io/u16rogue/user-container:latest
